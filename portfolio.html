    <main>
        <div class="Portfolio-wrapper">
            <div class="portfolio-container">

                <input type="checkbox" id="p1">
                <label for="p1" class="project">
                    <div class="row">
                    <div class="icon"><img src="Slike/Icon/ui-ux.svg" height="40px"></div>
                    <div class="description">
                        <h1>FRATELLI</h1>
                    </div>
                    </div>
                    <div class="column">
                    <p><b>Fratteli</b> is a project focused on designing
                        a warm, user-friendly <b>restaurant
                        app</b> inspired by Italian cuisine.
                        <span style="color:#E65994;font-weight:bold;">The goal</span> was to create a <b>clean and intuitive
                        experience</b> where users can explore the
                        menu, check nutritional information, and
                        easily save or order their favorite dishes.
                        With soft colors, simple icons, and a layout
                        that feels both modern and personal, Fratteli
                        reflects the way we interact with food -
                        and with design - in everyday life.</p>
                    </div>
                </label>

                <input type="checkbox" id="p2">
                <label for="p2" class="project">
                    <div class="row">
                    <div class="icon"><img src="Slike/Icon/pentool.svg" height="40px"></div>
                    <div class="description"><h1>STONED RPG</h1></div>
                    </div>
                    <div class="column">
                    <p>A project featuring <b>pixel art characters
                        design</b> for an RPG platformer inspired
                        by Greek mythology. Using Aseprite,
                        <b>I design characters, including
                        their animations and visual development</b>.
                        <b style="color:#E65994">My goal</b> was to bring personality and clarity
                        to each sprite through expressive pixel art,
                        while staying true to the mythological
                        theme and platformer mechanics. I handled
                        the full process ensuring each <b>character
                        felt dynamic, readable, and consistent</b>
                        with the game’s tone and narrative.</p>
                    </div>
                </label>

                <input type="checkbox" id="p3">
                <label for="p3" class="project">
                    <div class="row">
                    <div class="icon"><img src="Slike/Icon/pentool.svg" height="40px"></div>
                    <div class="description"><h1>GRAFIJADA</h1></div>
                    </div>
                    <div class="column">
                    <p><b>Grafijada</b> is a event that combines
                        the spirit of traditional student gatherings
                        ("ijade") with the format of a conference.
                        As part of the team, I was responsible
                        for <b>designing visual content for Instagram
                        to promote the event, engage the student
                        community, and communicate key information</b>.
                        The design features bold typography, vibrant
                        gradients, and layered elements
                        that reflect the event’s dynamic and
                        modern spirit, while staying consistent and
                        easy to follow across all posts.</p>
                    </div>
                </label>

                <input type="checkbox" id="p4">
                <label for="p4" class="project">
                    <div class="row">
                    <div class="icon"><img src="Slike/Icon/pentool.svg" height="40px"></div>
                    <div class="description">
                        <h1>GRID EXHIBITION</h1>
                    </div>
                    </div>
                    <div class="column">
                    <p>As part of the Student Association, I helped
                        organize the <b>first GRID exhibition</b> — a
                        showcase of student projects from the
                        Graphic Engineering and Design program.
                        The event celebrated creativity across all
                        years and courses, from posters and 3D
                        models to calligraphy and video. As a part of
                        the team, I designed <b>custom stickers</b> used
                        for promotion event.</p>
                    </div>
                </label>

                <input type="checkbox" id="p5">
                <label for="p5" class="project">
                    <div class="row">
                    <div class="icon"><img src="Slike/Icon/pentool.svg" height="40px"></div>
                    <div class="description">
                        <h1>DENTIST WEEK</h1>
                    </div>
                    </div>
                    <div class="column">
                    <p>I developed the <b>visual identity</b> for Healthy
                        Teeth Week, a children’s dental health campaign.
                        The branding includes a <b>logo mark,
                        logotype, and custom pattern</b>. The crocodile
                        mascot was chosen for its strong teeth, which
                        are essential for its survival. I illustrated it in a
                        playful, hand-colored style to feel childlike and
                        approachable, helping the campaign connect
                        with young audiences through warmth
                        and visual storytelling.</p>
                    </div>
                </label>

                <input type="checkbox" id="p6">
                <label for="p6" class="project">
                    <div class="row">
                        <div class="icon"><img src="Slike/Icon/pentool.svg" height="40px"></div>
                        <div class="description">
                            <h1>HAND-DRAWN</h1>
                        </div>
                    </div>
                    <div class="column">
                    <p>A collection of <b>hand-drawn portraits</b>. Each
                        piece captures the unique personality and
                        energy of the individual through my personal
                        drawing style and detailed craftsmanship.</p>
                    </div>
                </label>
